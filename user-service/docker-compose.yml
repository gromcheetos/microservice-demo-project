version: '3.8'
services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev
    ports:
      - "8180:8080"     # 8180 on host so it doesn't clash with user-service on 8081
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - user-net

  postgres:
    image: postgres:16-alpine
    container_name: pl_ecommerce_db
    environment:
      POSTGRES_DB: pl_ecommerce_app
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - user-net
    restart: always

networks:
  user-net:
    driver: bridge

volumes:
  pgdata: