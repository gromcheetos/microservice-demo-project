spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/pl_user_service
    username: userserviceadmin
    password: pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:database/migrations/
    schemas: user_service
    baselineOnMigrate: true
    out-of-order: true

keycloak:
  server-url: http://localhost:8180
  realm: ecommerce
  client-id: user-service-client
  client-secret: PASTE_YOUR_SECRET_HERE
  admin-username: admin
  admin-password: admin